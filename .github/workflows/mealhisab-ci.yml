name: MealHisab CI
on:
  push:
    paths:
      - 'mealhisab-bd/**'
  pull_request:
    paths:
      - 'mealhisab-bd/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mealhisab-bd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
