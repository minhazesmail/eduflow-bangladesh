<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#020617">
  <!-- Use the committed SVG favicon so the browser tab always has a real deployed asset. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <meta name="msapplication-TileColor" content="#020617">

  <meta name="description" content="EduFlow — Bangladesh-first coaching center management SaaS">
  <title>EduFlow App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"></div>
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
  <script src="finance2.js"></script>
  <script src="student360.js"></script>
  <script src="communication.js"></script>
  <script src="communication-access.js"></script>
  <script src="reminders.js"></script>
  <script src="reminder-ui.js"></script>
  <script src="nav-sync.js"></script>
  <script src="auth-ux.js"></script>
  <script src="ux-polish.js"></script>
  <script src="password-recovery.js"></script>
  <script>
    window.addEventListener('load', () => {
      if (new URLSearchParams(location.search).get('mode') === 'signup' && typeof authMode !== 'undefined') {
        authMode = 'signup';
        authScreen();
      }
    });
  </script>
</body>
</html>
