<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06142a"><link rel="icon" href="/eduflow-icon.svg"><title>EduFlow Guardian Portal</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="brand-refresh.css">
<style>.portal{max-width:980px;margin:0 auto;padding:24px}.portal-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.portal-brand{display:flex;align-items:center;gap:12px}.portal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.portal-card{padding:18px;border:1px solid rgba(148,163,184,.24);border-radius:18px;background:#fff}.portal-wide{grid-column:1/-1}.portal-list{display:grid;gap:10px}.portal-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #e5e7eb}@media(max-width:760px){.portal{padding:16px}.portal-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.portal-head{align-items:flex-start;flex-direction:column}.portal-wide{grid-column:1/-1}}</style>
</head><body><main class="portal"><header class="portal-head"><div class="portal-brand"><img src="/eduflow-icon.svg" alt="EduFlow" width="44" height="44"><div><strong>EduFlow</strong><div class="subtitle">Guardian Portal</div></div></div><button id="logout" class="btn btn-secondary">Sign out</button></header><div id="root"><div class="card"><div class="empty">Loading your guardian workspace…</div></div></div></main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){'use strict';const root=document.getElementById('root'),client=supabase.createClient(eduflowConfig.supabaseUrl,eduflowConfig.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const esc=v=>{const d=document.createElement('div');d.textContent=v==null?'':String(v);return d.innerHTML};const money=v=>'৳'+Number(v||0).toLocaleString('en-BD');const q=async p=>{const r=await p;if(r.error)throw r.error;return r.data||[]};async function load(){try{const {data:{session}}=await client.auth.getSession();if(!session?.user){root.innerHTML='<div class="card"><h2>Sign in required</h2><p class="subtitle">Use the invitation link from your coaching center.</p><a class="btn btn-primary" href="app.html">Sign in</a></div>';return;}const {data:ga,error:ge}=await client.from('guardian_accounts').select('guardian_id').eq('auth_user_id',session.user.id).single();if(ge||!ga){root.innerHTML='<div class="card"><h2>Portal not ready</h2><p class="subtitle">Ask your coaching center to resend the guardian invitation.</p></div>';return;}const g=await q(client.from('guardians').select('id,full_name,phone,email,preferred_language').eq('id',ga.guardian_id).single());const links=await q(client.from('student_guardians').select('student_id,is_primary').eq('guardian_id',g.id));const ids=links.map(x=>x.student_id);const students=ids.length?await q(client.from('students').select('id,name,student_code,class_level,monthly_fee,batches(name)').in('id',ids)):[];const attendance=ids.length?await q(client.from('attendance').select('student_id,present,attendance_date').in('student_id',ids).order('attendance_date',{ascending:false}).limit(300)):[];const payments=ids.length?await q(client.from('payments').select('student_id,amount,payment_method,receipt_no,paid_at').in('student_id',ids).order('paid_at',{ascending:false}).limit(100)):[];const results=ids.length?await q(client.from('results').select('student_id,marks,created_at,exams(name,total_marks)').in('student_id',ids).order('created_at',{ascending:false}).limit(100)):[];const orgNotes=await q(client.from('notices').select('title,body,created_at').order('created_at',{ascending:false}).limit(10));root.innerHTML='<div class="portal-grid"><section class="portal-card"><div class="label">Guardian</div><h2>'+esc(g.full_name)+'</h2><div class="subtitle">'+esc(g.phone||g.email||'')+'</div></section><section class="portal-card"><div class="label">Students</div><div class="value">'+students.length+'</div></section><section class="portal-card"><div class="label">Recent payments</div><div class="value">'+money(payments.reduce((a,x)=>a+Number(x.amount||0),0))+'</div></section><section class="portal-card"><div class="label">Language</div><div class="value" style="font-size:20px">'+esc(g.preferred_language||'bn')+'</div></section>'+students.map(s=>{const a=attendance.filter(x=>x.student_id===s.id);const pct=a.length?Math.round(a.filter(x=>x.present).length/a.length*100):0;const r=results.find(x=>x.student_id===s.id);return '<section class="portal-card portal-wide"><div class="section-head"><div><h2>'+esc(s.name)+'</h2><div class="subtitle">'+esc(s.student_code||'')+' · '+esc(s.batches?.name||s.class_level||'')+'</div></div><span class="badge badge-blue">'+pct+'% attendance</span></div><div class="portal-grid"><div class="portal-card"><div class="label">Monthly fee</div><div class="value">'+money(s.monthly_fee)+'</div></div><div class="portal-card"><div class="label">Last result</div><div class="value" style="font-size:20px">'+(r?Number(r.marks)+' / '+Number(r.exams?.total_marks||0):'—')+'</div></div><div class="portal-card" style="grid-column:span 2"><div class="label">Recent payments</div><div class="portal-list">'+payments.filter(x=>x.student_id===s.id).slice(0,4).map(p=>'<div class="portal-row"><span>'+esc(p.payment_method)+' · '+esc(p.receipt_no||'')+'</span><strong>'+money(p.amount)+'</strong></div>').join('')+'</div></div></div></section>'}).join('')+'<section class="portal-card portal-wide"><h2>Notices</h2><div class="portal-list">'+orgNotes.map(n=>'<div class="portal-row"><span><strong>'+esc(n.title)+'</strong><br><span class="subtitle">'+esc(n.body)+'</span></span><span class="subtitle">'+new Date(n.created_at).toLocaleDateString('en-BD')+'</span></div>').join('')||'<div class="empty">No notices.</div>'+'</div></section></div>';}catch(e){root.innerHTML='<div class="card"><h2>Could not load portal</h2><p class="subtitle">'+esc(e.message||'Please try again.')+'</p></div>';}}
document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.reload()};client.auth.onAuthStateChange(()=>load());load();})();
</script></body></html>
